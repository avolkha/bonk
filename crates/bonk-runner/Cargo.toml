[package]
name = "bonk-runner"
version.workspace = true
edition = "2024"

[[bin]]
name = "bonk-runner"
path = "src/main.rs"

[dependencies]
bonk-common = { path = "../bonk-common" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
which = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
