[workspace]
# Don't publish to crates.io — bonk is a binary tool distributed via GitHub Releases
publish = false

# Use git tags as the version baseline (packages aren't on crates.io).
# This ensures release-plz detects changes since the last git tag, not since
# the beginning of the repo.
git_only = true

# release-plz creates the git tag on Release PR merge,
# which triggers release.yml to build and publish the static binaries.
git_release_enable = true

[[package]]
name = "bonk-cli"
changelog_path = "CHANGELOG.md"
# Tag as v<version> so the release.yml trigger (v*.*.*) fires
git_tag_name = "v{{version}}"

[[package]]
name = "bonk-runner"
changelog_update = false
git_release_enable = false
# bonk-runner is embedded inside bonk output — version is kept in sync with
# the workspace version so changes to it trigger a bonk-cli release PR.

[[package]]
name = "bonk-common"
changelog_update = false
git_release_enable = false
