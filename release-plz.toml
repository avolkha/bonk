[workspace]
# Don't publish to crates.io — bonk is a binary tool distributed via GitHub Releases
publish = false

# release-plz creates the git tag on Release PR merge,
# which triggers release.yml to build and publish the static binaries.
git_release_enable = true

# Workaround: release-plz tries to canonicalize <crate_dir>/Cargo.lock for every
# commit, but in a workspace it only exists at the root. This causes every commit
# to be silently skipped. release_commits replaces that file-check with a regex
# match against conventional commit messages, bypassing the broken path lookup.
release_commits = "^(feat|fix|perf)(\\(.*\\))?!?:"

[[package]]
name = "bonk-cli"
changelog_path = "../../CHANGELOG.md"
# Tag as v<version> so the release.yml trigger (v*.*.*) fires
git_tag_name = "v{{version}}"

[[package]]
name = "bonk-runner"
changelog_update = false
git_release_enable = false

[[package]]
name = "bonk-common"
changelog_update = false
git_release_enable = false
